<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini GTA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hud">
  <div>💰 Money: <span id="money">0</span></div>
  <div>❤️ HP: <span id="hp">100</span></div>
  <div>🚓 Wanted: <span id="wanted">0</span></div>
</div>

<div id="game">
  <div id="player"></div>

  <div class="npc" style="left:300px;top:200px;"></div>
  <div class="npc" style="left:700px;top:400px;"></div>

  <div class="car" style="left:500px;top:150px;"></div>
  <div class="car" style="left:900px;top:500px;"></div>
</div>

<script src="script.js"></script>
</body>
</html>
